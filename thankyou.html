<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Cliford Andala</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'poppins', sans-serif;
        }
        body{
            background: #020617;
            color: #fff;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            text-align:center;
            padding:20px;
        }
        .thankyou-box{
            background: #01031a;
            padding:50px 30px;
            border-radius:20px;
            border:1px solid rgba(14,239,255,0.3);
            box-shadow: 0 0 30px rgba(14,239,255,0.2);
            max-width:500px;
        }
        .icon{
            width:80px;
            height:80px;
            background:#0ef;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:0 auto 20px;
            font-size:50px;
            color:#000;
        }
        h1{ font-size:32px; margin-bottom:15px; }
        h1 span{ color:#0ef; }
        p{ color:#cbd5e1; font-size:14px; line-height:1.6; margin-bottom:25px; }
        .btn{
            display:inline-block;
            padding:12px 30px;
            background:#0ef;
            color:#000;
            text-decoration:none;
            border-radius:30px;
            font-weight:600;
            margin:5px;
            box-shadow: 0 0 15px #0ef;
        }
        .btn:hover{
            box-shadow: 0 0 25px #0ef;
        }
        .btn-outline{
            background:transparent;
            color:#0ef;
            border:2px solid #0ef;
        }
    </style>
</head>
<body>
    <div class="thankyou-box">
        <div class="icon">
            <i class='bx bx-check'></i>
        </div>
        <h1>Thank <span>You!</span></h1>
        <p>Your message has been sent successfully to <b>clifordandala1999@gmail.com</b>. I will reply to you within 24 hours. Thank you for visiting my portfolio!</p>
        <a href="index.html" class="btn">Back to Home</a>
        <a href="https://wa.me/254797083040" class="btn btn-outline">WhatsApp Me</a>
    </div>
</body>
</html>
